[package]
name = "phoenix-pay"
description = "Unified payment abstraction for Phoenix: providers, order state machine, notify webhooks"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
flate2.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["http1", "tokio"] }
phoenix-database = { version = "0.1.1", path = "../phoenix-database", default-features = false }
phoenix-http = { version = "0.1.1", path = "../phoenix-http", default-features = false }
phoenix-plugin = { version = "0.1.1", path = "../phoenix-plugin", features = ["database"] }
phoenix-routing = { version = "0.1.1", path = "../phoenix-routing" }
ring.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
toasty.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[dev-dependencies]
aes-gcm.workspace = true
base64.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["http1", "server", "tokio"] }
# Tests exercise the Toasty-backed DbPaymentStore against SQLite, so the driver
# feature is enabled for the test build only (the library itself is
# backend-agnostic and links no driver).
phoenix-database = { version = "0.1.1", path = "../phoenix-database", features = ["sqlite"] }
ring.workspace = true
rustls-pemfile.workspace = true
serde_urlencoded.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true

[lints]
workspace = true
