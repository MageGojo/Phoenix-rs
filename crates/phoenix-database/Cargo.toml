[package]
name = "phoenix-database"
description = "Toasty database integration, migrations, and test isolation for Phoenix"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version = "0.1.1"
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["sqlite"]
sqlite = ["toasty/sqlite"]
pgsql = ["postgresql"]
postgresql = ["toasty/postgresql"]
mysql = ["toasty/mysql"]
# Batch test-data generation (factories, faker, seeding). Development and test
# only: nothing under `factory` should be compiled into a production build.
factory = []

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toasty.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
